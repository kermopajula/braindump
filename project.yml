name: BrainDump
options:
  bundleIdPrefix: com.braindump
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
settings:
  SWIFT_VERSION: "5.9"
  MARKETING_VERSION: "1.0.0"
  CURRENT_PROJECT_VERSION: "1"
targets:
  BrainDump:
    type: application
    platform: iOS
    supportedDestinations: [iOS]
    sources:
      - BrainDumpApp.swift
      - ContentView.swift
      - Models
      - Services
      - Views
      - Assets.xcassets
    settings:
      INFOPLIST_FILE: Info.plist
      PRODUCT_BUNDLE_IDENTIFIER: com.braindump.app
      DEVELOPMENT_TEAM: ""
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_REQUIRED: "NO"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        CFBundleName: BrainDump
        CFBundleDisplayName: BrainDump
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
        NSSpeechRecognitionUsageDescription: "BrainDump uses speech recognition to let you add knowledge and ask questions using your voice. All recognition happens on your device."
        NSMicrophoneUsageDescription: "BrainDump needs microphone access to capture your voice for speech-to-text input."
        ITSAppUsesNonExemptEncryption: false
        NSPrivacyCollectedDataTypes: []
        NSPrivacyTracking: false
        NSPrivacyTrackingDomains: []
